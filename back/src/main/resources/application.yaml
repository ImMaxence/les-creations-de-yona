spring:
  application:
    name: back
  config:
    # Local runs (from back/) reuse the Docker Compose secrets; in production the file is absent
    # and the same keys come from real environment variables.
    import: optional:file:../devops/.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      # Loads lazy associations of a page of results in a few IN queries instead of one per row.
      hibernate.default_batch_fetch_size: 50
  data:
    web:
      pageable:
        max-page-size: 50
  servlet:
    multipart:
      # Image uploads: 10 MB per file, plus room for the multipart envelope.
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    async:
      # The backup ZIP is streamed asynchronously: the server default (30 s) would cut it off.
      request-timeout: 30m
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            # Kept under /api so the reverse proxy routes it to the backend.
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
  web:
    # Validation messages in French, whatever the browser language.
    locale: fr_FR
    locale-resolver: fixed

server:
  # Behind the gateway (and Cloudflare + Coolify in production): the public URL comes from the
  # X-Forwarded-* headers, e.g. for the Google return URL. "framework" (Spring's filter) keeps the
  # port of X-Forwarded-Host (localhost:8000), which Tomcat's native support drops.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        secure: true
        same-site: lax

app:
  admin:
    emails: ${APP_ADMIN_EMAILS}
  s3:
    # Inside Docker Compose or Coolify: http://seaweedfs:8333.
    endpoint: ${S3_ENDPOINT:http://localhost:${S3_PORT:8333}}
    # Required by the S3 protocol, ignored by SeaweedFS.
    region: us-east-1
    bucket: ${S3_BUCKET}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
  backup:
    pg-dump: ${PG_DUMP_PATH:pg_dump}
  push:
    # Contact given to the push services with each notification (VAPID "sub"): an https URL or mailto:.
    subject: ${PUSH_SUBJECT:https://les-creations-de-yona.fr}
  gemini:
    # "Remplir avec l'IA" in the recipe editor. Without a key, its button stays greyed out.
    api-key: ${GEMINI_API_KEY:}
    # Free tier: Flash models only. Tried in order, the next one when a model is overloaded.
    models: ${GEMINI_MODELS:gemini-flash-latest,gemini-flash-lite-latest}
    timeout: 45s

springdoc:
  # Without it, responses are documented as */* and the generated front client reads them as Blob.
  default-produces-media-type: application/json
  api-docs:
    # Off unless API_DOCS_ENABLED=true (local .env): in production they would map the admin API.
    enabled: ${API_DOCS_ENABLED:false}
    path: /api/docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /api/docs/ui
    csrf:
      enabled: true
