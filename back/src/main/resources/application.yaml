spring:
  application:
    name: back
  config:
    # Local runs (from back/) reuse the Docker Compose secrets; in production the file is absent
    # and the same keys come from real environment variables.
    import: optional:file:../devops/.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      # Loads lazy associations of a page of results in a few IN queries instead of one per row.
      hibernate.default_batch_fetch_size: 50
  data:
    web:
      pageable:
        max-page-size: 50
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            # Kept under /api so the reverse proxy routes it to the backend.
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
  web:
    # Validation messages in French, whatever the browser language.
    locale: fr_FR
    locale-resolver: fixed

server:
  # Behind Cloudflare and Coolify: trust X-Forwarded-* to build https redirect URLs.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        secure: true
        same-site: lax

app:
  admin:
    emails: ${APP_ADMIN_EMAILS}

springdoc:
  api-docs:
    # Read by the front to generate its services; can be turned off in production.
    enabled: ${API_DOCS_ENABLED:true}
    path: /api/docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /api/docs/ui
    csrf:
      enabled: true
