<a class="skip-link" href="#contenu" (click)="skipToContent($event)">Aller au contenu</a>
<yona-navigation-progress />
@if (!backOffice()) {
  <yona-header />
}
<main #main id="contenu" class="main" [class.main--bare]="backOffice()" [class.main--waiting]="!!pageSkeleton()" tabindex="-1">
  <!-- The next page, drawn in grey while it is slow to come; the page left stays alive under it, in case the visitor stays -->
  @if (pageSkeleton(); as kind) {
    <yona-skeleton class="page-skeleton" [kind]="kind" [count]="kind === 'list' ? 6 : 8" />
  }
  <router-outlet />
</main>
@if (!backOffice()) {
  <yona-footer />
}
<yona-toasts />
<yona-cookie-banner />
<yona-install-banner />
<yona-timers-bar />
<!-- The name of every icon without text (header, steppers, close buttons), on mouse hover or keyboard focus -->
<yona-tooltip-layer />
