<a class="card" [routerLink]="link()" (click)="onClick($event)">
  <yona-cover-image
    class="card__image"
    [style.view-transition-name]="imageTransitionName()"
    [imageId]="recipe().imageId"
    [alt]="recipe().title"
    [priority]="priority()"
    sizes="(width >= 64rem) 22rem, 46vw"
  />
  <div class="card__body">
    <span class="card__category">{{ categories() }}</span>
    <h3 class="card__title">{{ recipe().title }}</h3>
    <time class="card__date" [attr.datetime]="recipe().createdAt">{{ recipe().createdAt | parisDate }}</time>
  </div>
</a>
