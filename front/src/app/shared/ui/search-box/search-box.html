<form class="search" [class.search--large]="large()" role="search" (submit)="submit($event)">
  <svg yonaIcon="search" class="search__icon" [size]="20"></svg>
  <input
    #input
    type="search"
    class="search__input"
    role="combobox"
    aria-label="Rechercher sur le site"
    aria-autocomplete="list"
    autocomplete="off"
    enterkeyhint="search"
    maxlength="100"
    placeholder="Une recette, un ingrédient, une occasion…"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="listboxId"
    [attr.aria-activedescendant]="activeOptionId()"
    [value]="query()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (focus)="focused.set(true)"
    (blur)="focused.set(false)"
  />
  @if (query()) {
    <button type="button" class="search__clear" aria-label="Effacer la recherche" (click)="clear()">
      <svg yonaIcon="x" [size]="18"></svg>
    </button>
  }
</form>

@if (expanded()) {
  <div
    role="listbox"
    class="suggestions"
    [class.suggestions--inline]="inline()"
    aria-label="Suggestions"
    [id]="listboxId"
    animate.enter="suggestions--enter"
  >
    @for (group of groups(); track group.label) {
      <div role="group" class="suggestions__group" [attr.aria-label]="group.label">
        <p class="suggestions__label" aria-hidden="true"><svg [yonaIcon]="group.icon" [size]="14"></svg>{{ group.label }}</p>
        @for (item of group.items; track item.index) {
          <!-- mousedown is cancelled so that the input keeps the focus until the click -->
          <div
            role="option"
            class="suggestion"
            [id]="listboxId + '-' + item.index"
            [class.is-active]="item.index === activeIndex()"
            [attr.aria-selected]="item.index === activeIndex()"
            (mousedown)="$event.preventDefault()"
            (click)="choose(item.pick)"
          >
            <!-- On one line: any whitespace here would show up inside the name -->
            @for (part of item.parts; track $index) {<span [class.match]="part.match">{{ part.text }}</span>}
          </div>
        }
      </div>
    }
  </div>
}
