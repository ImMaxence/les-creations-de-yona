<yona-dialog
  title="Choisir dans la galerie"
  size="lg"
  fixedHeight
  [subtitle]="images.totalElements() ? images.totalElements() + ' photo' + (images.totalElements() > 1 ? 's' : '') + ', les plus récentes en premier' : undefined"
  [(open)]="isOpen"
>
  <div class="filter" yonaSegmented role="group" aria-label="Images affichées">
    <button type="button" class="filter__tab" [attr.aria-pressed]="onlyUnused()" (click)="onlyUnused.set(true)">Non utilisées</button>
    <button type="button" class="filter__tab" [attr.aria-pressed]="!onlyUnused()" (click)="onlyUnused.set(false)">Toutes</button>
  </div>

  @if (images.items().length) {
      <ul role="list" class="grid" [class.is-loading]="images.isLoading()" [class.grid--portrait]="portrait()">
        @for (image of images.items(); track image.id) {
          <li>
            <button type="button" class="tile" (click)="choose(image)">
              <yona-cover-image class="tile__image" [imageId]="image.id" sizes="12rem" />
              <span class="tile__usage" [class.is-unused]="usage(image) === 'Non utilisée'">{{ usage(image) }}</span>
              <span class="tile__date">{{ image.createdAt | parisDate }}</span>
            </button>
          </li>
        }
      </ul>
  } @else if (images.isEmpty()) {
    <p class="empty">{{ onlyUnused() ? 'Aucune image inutilisée.' : 'La galerie est vide.' }}</p>
  } @else if (images.isLoading()) {
    <yona-skeleton kind="tiles" [count]="8" />
  }
  <yona-infinite-scroll skeleton="tiles" [list]="images" />
</yona-dialog>
