<dialog
  #dialog
  class="dialog"
  [class]="'dialog--' + size()"
  [class.dialog--fixed]="fixedHeight()"
  [attr.role]="role() === 'alertdialog' ? 'alertdialog' : null"
  [attr.aria-labelledby]="titleId"
  (close)="onClose()"
  (click)="onClick($event)"
>
  <header class="dialog__head">
    <div class="dialog__titles">
      <h2 class="dialog__title" [id]="titleId">{{ title() }}</h2>
      @if (subtitle()) {
        <p class="dialog__subtitle">{{ subtitle() }}</p>
      }
    </div>
    <button type="button" class="dialog__close" aria-label="Fermer" (click)="close()">
      <svg yonaIcon="x" [size]="20"></svg>
    </button>
  </header>
  <div #body class="dialog__body">
    <ng-content />
  </div>
  <!-- Hidden when nothing is projected (:empty) -->
  <footer class="dialog__actions"><ng-content select="[dialogActions]" /></footer>
</dialog>
