<div class="admin">
  @if (wide()) {
    <aside class="admin__side" [class.is-rail]="rail()">
      <yona-admin-nav [rail]="rail()" (railToggled)="toggleRail()" />
    </aside>
  } @else {
    <header class="admin__bar">
      <button type="button" class="admin__menu" aria-haspopup="dialog" (click)="openDrawer()">
        <svg yonaIcon="menu" [size]="24"></svg>
        Menu
        @if (waiting(); as count) {
          <span class="admin__waiting" [attr.aria-label]="count + ' en attente'">{{ count }}</span>
        }
      </button>
      @if (session.admin(); as admin) {
        <button type="button" class="admin__me" aria-label="Mon compte" aria-haspopup="dialog" (click)="openDrawer()">
          <yona-admin-avatar [name]="admin.name || admin.email" [picture]="admin.picture" />
        </button>
      }
    </header>

    <!-- Focusable (tabindex -1) so that opening it focuses the panel itself, not its first link -->
    <dialog #drawer class="admin__drawer" aria-label="Menu du back-office" tabindex="-1" (click)="closeOnBackdrop($event)">
      <yona-admin-nav drawer (closed)="closeDrawer()" />
    </dialog>
  }

  <div id="admin-content" class="admin__content" tabindex="-1">
    <!-- The page's heading for screen readers: each section's title follows, one level below -->
    <h1 class="visually-hidden">Back-office des créations de Yona</h1>
    <router-outlet />
  </div>
</div>
<!-- Confirmations are asked in the back-office only: loaded with it, not by every visitor -->
<yona-confirm-dialog />
<!-- The messages of the others as they come, at the top right of every page -->
<yona-message-toasts />
