<div class="container admin">
  <header class="admin__head">
    <div>
      <p class="eyebrow">Back-office</p>
      <h1 class="admin__title">Bonjour {{ firstName() }}</h1>
      <p class="admin__email">{{ email() }}</p>
      <p class="admin__versions">
        Site v{{ frontVersion }} · API v{{ backVersion.value()?.version ?? '…' }} ·
        <a routerLink="nouveautes">Nouveautés</a>
      </p>
    </div>
    <button yonaButton variant="secondary" type="button" (click)="signOut()">
      <svg yonaIcon="log-out"></svg>
      Se déconnecter
    </button>
  </header>

  <nav class="admin__nav" aria-label="Sections du back-office">
    <a routerLink="statistiques" routerLinkActive="is-active"><svg yonaIcon="chart-column" [size]="18"></svg>Statistiques</a>
    <a routerLink="recettes" routerLinkActive="is-active"><svg yonaIcon="book-open" [size]="18"></svg>Recettes</a>
    <a routerLink="categories" routerLinkActive="is-active"><svg yonaIcon="tags" [size]="18"></svg>Catégories</a>
    <a routerLink="tags" routerLinkActive="is-active"><svg yonaIcon="tag" [size]="18"></svg>Tags</a>
    <a routerLink="menus" routerLinkActive="is-active"><svg yonaIcon="list" [size]="18"></svg>Menus</a>
    <a routerLink="glossaire" routerLinkActive="is-active"><svg yonaIcon="book-a" [size]="18"></svg>Glossaire</a>
    <a routerLink="ingredients" routerLinkActive="is-active"><svg yonaIcon="carrot" [size]="18"></svg>Ingrédients</a>
    <a routerLink="reseaux-sociaux" routerLinkActive="is-active"><svg yonaIcon="share-2" [size]="18"></svg>Réseaux sociaux</a>
    <a routerLink="galerie" routerLinkActive="is-active"><svg yonaIcon="images" [size]="18"></svg>Galerie</a>
    <a routerLink="apparence" routerLinkActive="is-active"><svg yonaIcon="palette" [size]="18"></svg>Apparence</a>
    <a routerLink="preferences" routerLinkActive="is-active"><svg yonaIcon="sliders-horizontal" [size]="18"></svg>Préférences</a>
    <a routerLink="sauvegarde" routerLinkActive="is-active"><svg yonaIcon="database-backup" [size]="18"></svg>Sauvegarde</a>
    <a routerLink="corbeille" routerLinkActive="is-active"><svg yonaIcon="trash" [size]="18"></svg>Corbeille</a>
    <a routerLink="nouveautes" routerLinkActive="is-active"><svg yonaIcon="sparkles" [size]="18"></svg>Nouveautés</a>
  </nav>

  <router-outlet />
</div>
<!-- Confirmations are asked in the back-office only: loaded with it, not by every visitor -->
<yona-confirm-dialog />
<!-- The aria-label of every icon without text, on hover or keyboard focus -->
<yona-tooltip-layer />
