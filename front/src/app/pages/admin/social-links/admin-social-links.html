<form class="admin-section" aria-labelledby="social-title" novalidate (submit)="$event.preventDefault(); save()">
  <div class="admin-section__head">
    <h2 id="social-title">Réseaux sociaux</h2>
  </div>
  <p class="field__hint">Affichés dans le pied de page et le menu, dans cet ordre.</p>

  @if (draft().links.length) {
    <ul role="list" class="admin-list">
      @for (link of draft().links; track $index; let i = $index, last = $last) {
        <li class="admin-row">
          <yona-brand-icon [platform]="link.platform" [size]="22" />
          <yona-select label="Réseau" [options]="platformOptions" [formField]="linksForm.links[i].platform" />
          <div class="field admin-row__main">
            <input
              type="url"
              inputmode="url"
              class="input"
              placeholder="https://www.instagram.com/…"
              [attr.aria-label]="'Adresse de la page ' + (i + 1)"
              [formField]="linksForm.links[i].url"
            />
            <yona-field-error [field]="linksForm.links[i].url" />
          </div>
          <div class="admin-row__actions">
            <button type="button" class="icon-button" aria-label="Monter" [disabled]="i === 0" (click)="move(i, i - 1)"><svg lucideArrowUp [size]="16"></svg></button>
            <button type="button" class="icon-button" aria-label="Descendre" [disabled]="last" (click)="move(i, i + 1)"><svg lucideArrowDown [size]="16"></svg></button>
            <button type="button" class="icon-button icon-button--danger" aria-label="Retirer ce réseau" (click)="remove(i)"><svg lucideTrash2 [size]="16"></svg></button>
          </div>
        </li>
      }
    </ul>
  } @else {
    <p class="admin-empty">Aucun réseau social affiché.</p>
  }
  <yona-field-error [field]="linksForm.links" />

  <div class="admin-toolbar">
    @if (canAdd()) {
      <button yonaButton variant="secondary" type="button" (click)="add()"><svg lucidePlus></svg>Ajouter un réseau</button>
    }
    <button yonaButton type="submit" [disabled]="saving()">{{ saving() ? 'Enregistrement…' : 'Enregistrer' }}</button>
  </div>
</form>
