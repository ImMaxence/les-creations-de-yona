<ol role="list" class="list">
  @for (step of steps(); track $index; let i = $index) {
    <li class="step" [id]="stepAnchor(i + 1, part())" [class.is-done]="done().has(i)" yonaReveal>
      <button
        type="button"
        class="step__number"
        [attr.aria-pressed]="done().has(i)"
        [attr.aria-label]="'Étape ' + (i + 1) + ' faite'"
        (click)="toggle(i)"
      >
        @if (done().has(i)) {
          <svg yonaIcon="check" [size]="20" [strokeWidth]="2.5"></svg>
        } @else {
          {{ i + 1 }}
        }
      </button>
      <div class="step__body">
        <div
          class="prose"
          [innerHTML]="step.description | markdown | glossary: glossary()"
          (click)="popover.handle($event, glossary())"
          (keydown)="popover.handle($event, glossary())"
        ></div>
        @if (step.durationMinutes; as minutes) {
          <span class="step__duration">
            <svg yonaIcon="timer" [size]="14"></svg>
            {{ formatMinutes(minutes) }}
          </span>
        }
      </div>
    </li>
  }
</ol>

<yona-glossary-popover #popover />
