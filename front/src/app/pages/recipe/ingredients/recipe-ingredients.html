<div class="head">
  <h2 id="ingredients-title">Ingrédients</h2>
  @if (servings(); as count) {
    <div class="servings" role="group" aria-label="Nombre de portions">
      <button
        type="button"
        class="servings__button no-print"
        aria-label="Une portion de moins"
        [disabled]="count === 1"
        (click)="changeServings(-1)"
      >
        <svg lucideMinus [size]="16"></svg>
      </button>
      <span class="servings__count" aria-live="polite">
        <strong>{{ count }}</strong> {{ count === 1 ? 'portion' : 'portions' }}
      </span>
      <button
        type="button"
        class="servings__button no-print"
        aria-label="Une portion de plus"
        [disabled]="count === maxServings"
        (click)="changeServings(1)"
      >
        <svg lucidePlus [size]="16"></svg>
      </button>
    </div>
  }
</div>

@if (partCount() > 1) {
  <p class="total-hint">Total pour les {{ partCount() }} parties, détaillées dans la préparation.</p>
}

<yona-ingredient-list class="list" [lines]="lines()" />

@if (wakeLockSupported()) {
  <button
    type="button"
    class="screen-toggle no-print"
    [class.is-on]="screenKeptOn()"
    [attr.aria-pressed]="screenKeptOn()"
    (click)="toggleScreenOn()"
  >
    <svg lucideSun [size]="18"></svg>
    {{ screenKeptOn() ? "L'écran reste allumé" : "Garder l'écran allumé" }}
  </button>
}
