<div class="container bar">
  <yona-brand-logo />

  <nav class="nav" aria-label="Navigation principale">
    <ul role="list" class="nav__list">
      <li>
        <a
          class="nav__link"
          routerLink="/"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          >Accueil</a
        >
      </li>
      <li>
        <a class="nav__link" [routerLink]="recipesPath" routerLinkActive="is-active">Recettes</a>
      </li>
      <li>
        <yona-category-menu [categories]="siteData.categories()" />
      </li>
      <li>
        <a class="nav__link" [routerLink]="installPath" routerLinkActive="is-active">Installer l'application</a>
      </li>
      @if (adminSession.isAdmin()) {
        <li>
          <a class="nav__link" routerLink="/admin" routerLinkActive="is-active">Administration</a>
        </li>
      }
    </ul>
  </nav>

  <yona-mobile-menu class="mobile-menu" />
</div>
