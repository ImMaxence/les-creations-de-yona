<!-- Tooltips of the icons below them: beside them, they would cover the next one -->
<div class="container bar" data-tooltip-place="below">
  <yona-brand-logo />

  <nav class="nav" aria-label="Navigation principale">
    <ul role="list" class="nav__list">
      <li>
        <a
          class="nav__link"
          routerLink="/"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          >Accueil</a
        >
      </li>
      <li>
        <yona-recipes-menu />
      </li>
      @if (siteData.capPublished()) {
        <li>
          <a class="nav__link" [routerLink]="capPath" routerLinkActive="is-active">Mon CAP</a>
        </li>
      }
      @if (siteData.shopOpen()) {
        <li>
          <a class="nav__link" [routerLink]="shopPath" routerLinkActive="is-active">Boutique</a>
        </li>
      }
      @if (adminSession.isAdmin()) {
        <li>
          <a class="nav__link" routerLink="/admin" routerLinkActive="is-active">Administration</a>
        </li>
      }
    </ul>
  </nav>

  <button type="button" class="search-toggle" aria-label="Rechercher" aria-haspopup="dialog" (click)="searchOpen.set(true)">
    <svg yonaIcon="search" [size]="20"></svg>
  </button>
  <yona-kitchen-links class="kitchen-links" />
  <yona-color-scheme-switch class="scheme-switch" />
  <yona-mobile-menu class="mobile-menu" />
</div>

<!-- The search of the whole site, from any page: suggestions under the field, the dialog grows with them -->
<yona-dialog title="Rechercher" [(open)]="searchOpen">
  @if (searchOpen()) {
    <yona-site-search inline autofocus (navigated)="searchOpen.set(false)" />
  }
</yona-dialog>
