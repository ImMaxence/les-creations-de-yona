<ng-template #icon let-value>
  @switch (value) {
    @case ('light') {
      <svg yonaIcon="sun" [size]="18"></svg>
    }
    @case ('dark') {
      <svg yonaIcon="moon" [size]="18"></svg>
    }
    @default {
      <svg yonaIcon="sun-moon" [size]="18"></svg>
    }
  }
</ng-template>

@if (layout() === 'full') {
  <div class="segments" yonaSegmented role="group" aria-label="Affichage">
    @for (option of options; track option.value) {
      <button
        type="button"
        class="segment"
        [class.is-active]="option.value === colorScheme.preference()"
        [attr.aria-pressed]="option.value === colorScheme.preference()"
        (click)="choose(option.value)"
      >
        <ng-container *ngTemplateOutlet="icon; context: { $implicit: option.value }" />
        {{ option.label }}
      </button>
    }
  </div>
} @else {
  <button
    type="button"
    class="trigger"
    aria-controls="color-scheme-menu"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="'Affichage : ' + current().label"
    [class.is-open]="open()"
    (click)="open.set(!open())"
  >
    <ng-container *ngTemplateOutlet="icon; context: { $implicit: current().value }" />
  </button>

  @if (open()) {
    <ul id="color-scheme-menu" role="list" class="panel" animate.enter="panel--enter" animate.leave="panel--leave">
      @for (option of options; track option.value) {
        <li>
          <button
            type="button"
            class="panel__option"
            [attr.aria-pressed]="option.value === colorScheme.preference()"
            (click)="choose(option.value)"
          >
            <ng-container *ngTemplateOutlet="icon; context: { $implicit: option.value }" />
            {{ option.label }}
            @if (option.value === colorScheme.preference()) {
              <svg yonaIcon="check" class="panel__check" [size]="16"></svg>
            }
          </button>
        </li>
      }
      <!-- Text size, contrast, motion…: the other display choices, and the way back to the site as it comes -->
      <li class="panel__more">
        <a class="panel__option" [routerLink]="accessibilityPath" (click)="open.set(false)">
          <svg yonaIcon="accessibility" [size]="18"></svg>
          Accessibilité
        </a>
      </li>
      <li>
        <button type="button" class="panel__option" [disabled]="displayPreferences.onSiteDefaults()" (click)="resetAll()">
          <svg yonaIcon="rotate-ccw" [size]="18"></svg>
          Paramètres par défaut
        </button>
      </li>
    </ul>
  }
}
