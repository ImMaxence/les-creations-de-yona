<button
  type="button"
  class="trigger"
  [attr.aria-controls]="panelId()"
  [attr.aria-expanded]="open()"
  [class.is-open]="open()"
  (click)="toggle()"
>
  {{ label() }}
  <svg yonaIcon="chevron-down" class="trigger__chevron" [size]="16"></svg>
</button>

@if (open()) {
  <div [id]="panelId()" class="panel" animate.enter="panel--enter" animate.leave="panel--leave">
    <ul role="list" class="panel__list">
      @for (category of shown(); track category.id; let i = $index) {
        <li [style.--i]="i">
          <a class="panel__link" [routerLink]="recipesPath" [queryParams]="queryParams(category)" (click)="close()">
            {{ category.name }}
          </a>
        </li>
      } @empty {
        <li class="panel__empty">Les catégories arrivent bientôt</li>
      }
    </ul>
    <a class="panel__all" [routerLink]="recipesPath" [queryParams]="allQueryParams()" (click)="close()">
      Toutes les recettes {{ label().toLowerCase() }}es
      <svg yonaIcon="arrow-right" [size]="16"></svg>
    </a>
  </div>
}
