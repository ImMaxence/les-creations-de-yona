<footer class="footer">
  <div class="container footer__inner" yonaReveal>
    <div class="footer__brand">
      <p class="footer__name">Les créations <em>de Yona</em></p>
      <p class="footer__tagline">{{ siteData.content().footerText }}</p>
      <div class="footer__extras">
        <yona-notify-button />
        <a class="footer__glossary" [routerLink]="glossaryPath"><svg yonaIcon="book-a" [size]="18"></svg>Glossaire de pâtisserie</a>
      </div>
    </div>

    @if (siteData.socialLinks().length) {
      <ul role="list" class="footer__socials">
        @for (link of siteData.socialLinks(); track link.platform) {
          <li>
            <a
              [href]="link.url"
              target="_blank"
              rel="noopener noreferrer"
              [attr.aria-label]="socialPlatformLabel(link.platform)"
            >
              <yona-brand-icon [platform]="link.platform" />
            </a>
          </li>
        }
      </ul>
    }

    <nav class="footer__legal" aria-label="Informations légales">
      <a [routerLink]="legalNoticePath">Mentions légales</a>
      <a [routerLink]="privacyPolicyPath">Politique de confidentialité</a>
      <button type="button" class="footer__cookies" (click)="consent.reopen()">Gestion des cookies</button>
    </nav>

    <div class="footer__bottom">
      <p class="footer__copyright">© {{ year }} Les créations de Yona</p>
      <!-- Always shown: the installed app has no address bar to type /admin. The page itself is protected. -->
      <a class="footer__admin" [routerLink]="adminPath" rel="nofollow">Espace admin</a>
    </div>
  </div>
</footer>
