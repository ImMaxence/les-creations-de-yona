<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Les créations de Yona</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Recettes maison, simples et gourmandes : plats, desserts et douceurs à refaire chez soi">
  <!-- Name under the icon once installed: iOS reads it here rather than in the manifest -->
  <meta name="apple-mobile-web-app-title" content="Recette Yona">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Light or dark display chosen by the visitor (ColorScheme), applied before the first paint -->
  <script>try{var s=localStorage.getItem('yona-color-scheme');if(s==='light'||s==='dark')document.documentElement.setAttribute('data-color-scheme',s)}catch(e){}</script>
</head>
<body>
  <yona-root></yona-root>
  <noscript>Activez JavaScript pour profiter de toutes les fonctions du site</noscript>
</body>
</html>
