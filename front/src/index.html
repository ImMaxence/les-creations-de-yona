<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Les créations de Yona</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Recettes maison, simples et gourmandes : plats, desserts et douceurs à refaire chez soi">
  <!-- Name under the icon once installed: iOS reads it here rather than in the manifest -->
  <meta name="apple-mobile-web-app-title" content="Recette Yona">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Light or dark display (ColorScheme) and the choices of the page Accessibilité (DisplayPreferencesStore), applied before the first paint -->
  <script>try{var r=document.documentElement,s=localStorage.getItem('yona-color-scheme');if(s==='light'||s==='dark')r.setAttribute('data-color-scheme',s);var a=JSON.parse(localStorage.getItem('yona-accessibility')||'{}')||{};if(a.textSize==='large'||a.textSize==='larger')r.setAttribute('data-text-size',a.textSize);if(a.contrast===true)r.setAttribute('data-contrast','more');if(a.reduceMotion===true)r.setAttribute('data-motion','reduce');if(a.readableFont===true)r.setAttribute('data-font','readable');if(a.underlineLinks===true)r.setAttribute('data-links','underline');if(a.textSpacing===true)r.setAttribute('data-spacing','wide')}catch(e){}</script>
</head>
<body>
  <yona-root></yona-root>
  <noscript>Activez JavaScript pour profiter de toutes les fonctions du site</noscript>
</body>
</html>
