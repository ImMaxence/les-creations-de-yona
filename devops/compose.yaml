name: les-creations-de-yona

# Logs kept per container: 3 files of 10 MB, the oldest dropped first. They also disappear when the
# container is recreated (every deployment). See the privacy policy: server logs, 12 months at most.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # ICU French collation: titles sort the French way (é next to e) on every OS.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --locale-provider=icu --icu-locale=fr-FR
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      # PostgreSQL 18+ images store data under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    shm_size: 128mb
    healthcheck:
      test: pg_isready --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    logging: *logging
    command:
      - mini
      - -dir=/data
      - -bucket=${S3_BUCKET:?S3_BUCKET is required}
      - -s3.autoCreateBucket=false
      - -s3.allowDeleteBucketNotEmpty=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -webdav=false
      # Disables the web UI only: the admin server (23646) and its gRPC port (33646) keep
      # running unauthenticated inside the container. Never publish these ports.
      - -admin.ui=false
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    ports:
      - 127.0.0.1:${S3_PORT:-8333}:8333
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8333/healthz]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  # Optional locally (docker compose --profile app up -d --wait): the usual run is ./mvnw from back/.
  back:
    profiles: [app]
    build: ../back
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:?APP_ADMIN_EMAILS is required}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    ports:
      - 127.0.0.1:${BACK_PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # Angular SSR server. Not published: reached through the gateway, like in production.
  front:
    profiles: [app]
    build: ../front
    restart: unless-stopped
    logging: *logging
    environment:
      # The SSR server calls the backend directly, inside the Compose network
      API_URL: http://back:8080
      NG_ALLOWED_HOSTS: localhost
      # Only reachable through the gateway: its forwarded headers can be trusted
      NG_TRUST_PROXY_HEADERS: x-forwarded-host,x-forwarded-proto,x-forwarded-for
    depends_on:
      back:
        condition: service_healthy

  # Whole application on http://localhost:8000: /api/* to the backend, the rest to the front.
  gateway:
    profiles: [app]
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - 127.0.0.1:${APP_PORT:-8000}:80
    depends_on:
      front:
        condition: service_healthy

volumes:
  postgres-data:
  seaweedfs-data:
