# Production, deployed by Coolify (Docker Compose build pack, Base Directory /devops).
# Differences with compose.yaml (local): no published port, no profile, the public domain is set
# on the gateway in Coolify, and secrets come from Coolify:
#   - SERVICE_USER_* / SERVICE_PASSWORD_64_*: generated by Coolify on the first deployment, kept after;
#   - GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, APP_ADMIN_EMAILS: entered in Environment Variables;
#   - GEMINI_API_KEY: optional, entered there too (free key from Google AI Studio).
# Build contexts are relative to this folder (Coolify's project directory is the Base Directory).

# Logs kept per container: 3 files of 10 MB, the oldest dropped first. They also disappear when the
# container is recreated (every deployment). See the privacy policy: server logs, 12 months at most.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yona}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      # ICU French collation: titles sort the French way (é next to e) on every OS.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --locale-provider=icu --icu-locale=fr-FR
    volumes:
      # PostgreSQL 18+ images store data under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    shm_size: 128mb
    healthcheck:
      test: pg_isready --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    logging: *logging
    command:
      - mini
      - -dir=/data
      - -bucket=${S3_BUCKET:-yona-images}
      - -s3.autoCreateBucket=false
      - -s3.allowDeleteBucketNotEmpty=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -webdav=false
      # Disables the web UI only: the admin server (23646) and its gRPC port (33646) keep
      # running unauthenticated inside the container. Never publish these ports.
      - -admin.ui=false
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${SERVICE_USER_S3}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_64_S3}
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8333/healthz]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  back:
    build: ../back
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-yona}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-yona-images}
      S3_ACCESS_KEY: ${SERVICE_USER_S3}
      S3_SECRET_KEY: ${SERVICE_PASSWORD_64_S3}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?}
      APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:?}
      # Optional: "Remplir avec l'IA" in the recipe editor, greyed out without it.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # API_DOCS_ENABLED stays unset: no API documentation in production.
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # Angular SSR server, reached through the gateway only.
  front:
    build:
      context: ../front
      # The CHANGELOG at the root, shown in the back-office ("Nouveautés")
      additional_contexts:
        repo: ..
    restart: unless-stopped
    logging: *logging
    environment:
      # The SSR server calls the backend directly, inside the Compose network
      API_URL: http://back:8080
      # Only reachable through the gateway: its forwarded headers can be trusted
      NG_TRUST_PROXY_HEADERS: x-forwarded-host,x-forwarded-proto,x-forwarded-for
    depends_on:
      back:
        condition: service_healthy

  # Only service with a domain in Coolify (https://les-creations-de-yona.fr, port 80 inside).
  gateway:
    build: ./gateway
    restart: unless-stopped
    logging: *logging
    depends_on:
      front:
        condition: service_healthy

volumes:
  postgres-data:
  seaweedfs-data:
